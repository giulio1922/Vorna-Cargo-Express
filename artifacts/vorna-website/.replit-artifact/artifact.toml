kind = "web"
previewPath = "/"
title = "VORNA Logistics"
version = "1.0.0"
id = "artifacts/vorna-website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24869

[services.development]
run = "pnpm --filter @workspace/vorna-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vorna-website", "run", "build" ]
publicDir = "artifacts/vorna-website/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24869"
BASE_PATH = "/"
